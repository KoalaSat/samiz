services:
  samiz:
    build:
      context: .
      dockerfile: Dockerfile
    privileged: true
    network_mode: host
    volumes:
      - /var/run/dbus:/var/run/dbus:ro
      - ./main.py:/app/main.py
      - ./src:/app/src
      - ./data:/app/data
    devices:
      - /dev/bus/usb:/dev/bus/usb
  strfry:
    build: ./strfry
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./strfry/strfry.conf:/etc/strfry.conf:ro
      - ./strfry/relay_urls.txt:/app/relay_urls.txt:ro
      - ./strfry/db:/app/strfry-db:rw